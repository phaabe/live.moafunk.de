name: EPIC - Integration checks

on:
  pull_request:
    branches:
      - main
      - dev/312-interim
      - dev/streaming-architecture
      - staging
  push:
    branches:
      - main
      - dev/312-interim
      - dev/streaming-architecture
      - staging

# Both checks must exist for every PR, including documentation-only changes.
# Keep path filters out of this workflow so these names can be required.
permissions:
  contents: read

concurrency:
  group: epic-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev ffmpeg

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      - name: Check backend formatting
        run: cargo fmt --check

      # Every run measures coverage, so the floors below gate PRs too.
      # Pushes to staging also keep the results for the test dashboard
      # (test-dashboard.yml).
      - name: Install the coverage tool
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Run backend tests
        id: tests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          set -euo pipefail
          rustup component add llvm-tools-preview
          mkdir -p ../results
          # src/bin/ holds dev tools, not product code.
          ignore='src/bin/'
          cargo llvm-cov --locked --all-targets --no-report | tee ../results/cargo-test.txt
          cargo llvm-cov report --json --summary-only --ignore-filename-regex "$ignore" \
            --output-path ../results/coverage.json
          cargo llvm-cov report --lcov --ignore-filename-regex "$ignore" \
            --output-path ../results/lcov.info

      # Only the critical modules in backend/coverage-floors.json are gated;
      # all other coverage is reported on the test dashboard.
      - name: Check coverage floors
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        working-directory: .
        run: node scripts/coverage-floors.cjs results/coverage.json backend/coverage-floors.json

      - name: Keep the results for the test dashboard
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-backend
          path: results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Clippy
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo clippy --locked --all-targets

      - name: Check the shell scripts (shellcheck)
        if: ${{ !cancelled() }}
        working-directory: .
        # Pinned, so a runner image update cannot change the findings.
        run: |
          set -euo pipefail
          git ls-files -z '*.sh' ':!:.claude/' ':!:.codex/' |
            xargs -0 pipx run --spec shellcheck-py==0.10.0.1 shellcheck -S warning

  frontend:
    name: frontend-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Test workflow rules
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node --test ../.github/workflows/tests/*.test.cjs

      - name: Run frontend typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run typecheck

      - name: Run frontend tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          REPORT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
        run: |
          set -euo pipefail
          if [[ "$REPORT" == true ]]; then
            mkdir -p ../results
            npm test -- --run --coverage --reporter=default --reporter=json --outputFile.json=../results/vitest.json
            cp coverage/coverage-summary.json coverage/lcov.info ../results/
          else
            npm test -- --run
          fi

      - name: Keep the results for the test dashboard
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/staging' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-frontend
          path: results/
          if-no-files-found: ignore
          retention-days: 14
