name: TEST - Stream system

# Runs the live stream chain end to end: the backend's stream handler and
# producer ffmpeg push a tone into Liquidsoap, and the tests decode what
# listeners get from Icecast (backend/src/stream_system_tests.rs). Liquidsoap
# and Icecast-KH run as in production: the same images, configs and host
# networking (docs/stream-rework/prod/), with throwaway passwords.

on:
  # Every PR, without path filters: stream-system is a required check, and a
  # required check that does not start blocks the merge. On PRs into staging
  # the job is skipped by its `if` when the PR touches nothing in the stream
  # chain (a skipped job reports success). Pushes to staging and PRs into
  # main always run it, so a miss shows up after the merge, before a release.
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
    paths:
      - backend/src/**
      - backend/Cargo.toml
      - backend/Cargo.lock
      - docs/stream-rework/prod/**
      - .github/workflows/stream-system.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stream-system-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Production runs savonet/liquidsoap:v2.4.4 from Docker Hub; this is its
  # digest, pulled from mirrors because Docker Hub pulls fail on the runners.
  LIQUIDSOAP_DIGEST: sha256:cfcd6e31e8c3d5f81d8f0e3dc148b9bec6356a86c14cb5dc19808779f55ae75e
  HARBOR_LIVE_PASSWORD: ci-harbor-live
  HARBOR_TEST_PASSWORD: ci-harbor-test
  ICECAST_SOURCE_PASSWORD: ci-icecast-source

jobs:
  stream-scope:
    name: stream-system scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      stream: ${{ steps.touches.outputs.stream }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR merge commit and its parents, for scripts/pr-touches.sh.
          fetch-depth: 2
          persist-credentials: false

      # The stream chain: the stream handler and what it calls, the test
      # helpers, dependencies and the production Liquidsoap/Icecast configs.
      - name: Check what the PR changes
        id: touches
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          stream="$(scripts/pr-touches.sh '^backend/src/(handlers/(stream_ws|recording)|stream_[a-z_]+|recording[a-z_]*|broadcast_tests|audio|auth|config|main|metrics|telegram_notify)\.rs$|^backend/Cargo\.(toml|lock)$|^docs/stream-rework/prod/|^\.github/workflows/stream-system\.yml$|^\.github/actions/apt-install/|^scripts/pr-touches\.sh$')"
          echo "stream=$stream" >>"$GITHUB_OUTPUT"

  system:
    name: stream-system
    needs: stream-scope
    # Runs unless the scope says false, so a failed scope job never skips it.
    if: ${{ !cancelled() && needs.stream-scope.outputs.stream != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      # Same as backend-ci (epic-ci.yml): debug info with file and line only.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The images need no Rust, so they are pulled and built in the
      # background while ffmpeg and Rust install. "Wait for the stream stack
      # images" stops the job if this fails.
      - name: Prepare the stream stack images in the background
        run: |
          set -euo pipefail
          # Anonymous pulls from shared runner addresses hit registry rate
          # limits, so try each mirror a few times before the next one.
          pull() {
            local target=$1
            shift
            for source in "$@"; do
              for attempt in 1 2 3; do
                if docker pull "$source"; then
                  docker tag "$source" "$target"
                  return 0
                fi
                sleep $((attempt * 10))
              done
            done
            echo "Could not pull $target from any mirror" >&2
            return 1
          }
          prepare() {
            # The Icecast-KH Dockerfile starts FROM debian:12-slim.
            pull debian:12-slim \
              mirror.gcr.io/library/debian:12-slim \
              public.ecr.aws/docker/library/debian:12-slim
            pull moafunk/liquidsoap:ci \
              "mirror.gcr.io/savonet/liquidsoap@${LIQUIDSOAP_DIGEST}" \
              "ghcr.io/savonet/liquidsoap@${LIQUIDSOAP_DIGEST}"
            docker build -f docs/stream-rework/prod/icecast-kh.Dockerfile \
              -t moafunk/icecast-kh:ci docs/stream-rework/prod
          }
          # The inner subshell stops at the first error. All output goes to
          # the log, so the step ends at once.
          (
            set +e
            (set -e; prepare)
            echo $? >"$RUNNER_TEMP/stack-images.exit"
          ) >"$RUNNER_TEMP/stack-images.log" 2>&1 &

      - name: Install ffmpeg
        uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg
          options: --no-install-recommends

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0

      # Restores the dependency builds of the last staging push. Only staging
      # pushes save, so PR runs cannot evict each other's caches.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/staging' }}

      - name: Wait for the stream stack images
        run: |
          set -euo pipefail
          exit_file="$RUNNER_TEMP/stack-images.exit"
          log="$RUNNER_TEMP/stack-images.log"
          for _ in $(seq 1 600); do
            [[ -s "$exit_file" ]] && break
            sleep 1
          done
          code=$(cat "$exit_file" 2>/dev/null) || code="none after 10 minutes"
          if [[ "$code" != 0 ]]; then
            cat "$log"
            echo "::error::Pulling or building the stream stack images failed (exit code: $code)"
            exit 1
          fi
          echo "::group::Image pull and build log"
          cat "$log"
          echo "::endgroup::"

      - name: Start Icecast with the production config
        run: |
          set -euo pipefail
          sed -e "s/CHANGE_ME_SOURCE/${ICECAST_SOURCE_PASSWORD}/" \
              -e "s/CHANGE_ME_RELAY/ci-relay/" -e "s/CHANGE_ME_ADMIN/ci-admin/" \
              docs/stream-rework/prod/icecast.xml > "$RUNNER_TEMP/icecast.xml"
          chmod 644 "$RUNNER_TEMP/icecast.xml"
          docker run -d --name icecast --network host \
            -v "$RUNNER_TEMP/icecast.xml:/etc/moafunk/icecast.xml:ro" \
            moafunk/icecast-kh:ci

      - name: Start Liquidsoap with the production script
        run: |
          set -euo pipefail
          docker run -d --name liquidsoap --network host \
            -e HARBOR_LIVE_PASSWORD -e HARBOR_TEST_PASSWORD -e ICECAST_SOURCE_PASSWORD \
            -v "$PWD/docs/stream-rework/prod/moafunk.liq:/moafunk.liq:ro" \
            moafunk/liquidsoap:ci liquidsoap /moafunk.liq

      # Builds while Liquidsoap and Icecast start. The test step below then
      # only runs the tests.
      - name: Build the system tests
        working-directory: backend
        run: cargo test --locked --no-run

      - name: Wait for both mounts
        run: |
          set -euo pipefail
          # Icecast answers HEAD with 400, so probe with GET.
          for _ in $(seq 1 60); do
            live=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8010/live.mp3 || true)
            preview=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8010/test.mp3 || true)
            if [ "$live" = 200 ] && [ "$preview" = 200 ]; then
              echo "Both mounts are up"
              exit 0
            fi
            sleep 1
          done
          echo "Mounts not up: /live.mp3 $live, /test.mp3 $preview" >&2
          exit 1

      # cargo is green with "0 passed" when the filter matches nothing, so
      # the step checks that every system test in the source ran and passed.
      - name: Run the system tests
        working-directory: backend
        env:
          # The workflow tests point this at a fixture.
          SYSTEM_TESTS_SOURCE: src/stream_system_tests.rs
        run: |
          set -euo pipefail
          expected=$(grep -cE '#\[ignore = ".*run by the stream-system CI job"]' "$SYSTEM_TESTS_SOURCE") || true
          if [[ ! "$expected" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::No system tests found in $SYSTEM_TESTS_SOURCE"
            exit 1
          fi
          log="$RUNNER_TEMP/stream-system-tests.log"
          # No color, so the "... ok" lines below match.
          cargo test --locked stream_system_tests -- --ignored --test-threads=1 --color never | tee "$log"
          passed=$(grep -cE '^test stream_system_tests::[^ ]+ \.\.\. ok$' "$log") || true
          if [[ "$passed" != "$expected" ]]; then
            echo "::error::$passed of $expected system tests passed"
            exit 1
          fi

      - name: Show stream stack logs
        if: failure()
        run: |
          docker logs liquidsoap || true
          docker logs icecast || true
