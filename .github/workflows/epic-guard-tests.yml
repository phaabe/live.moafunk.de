name: Epic guard tests

on:
  pull_request:
    paths:
      - scripts/epic_guard/**
      - .github/epic-lanes.yml
      - .github/workflows/epic-guard*.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: epic-guard-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/epic_guard -v
