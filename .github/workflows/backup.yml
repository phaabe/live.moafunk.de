name: OPS - Back up database and R2

on:
  # Weekly scheduled backup (Sunday 3am UTC)
  schedule:
    - cron: "0 3 * * 0"

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      full_r2_backup:
        type: boolean
        description: "Create dated R2 snapshot (vs incremental sync)"
        default: false
      backup_db:
        type: boolean
        description: "Backup database"
        default: true
      backup_r2:
        type: boolean
        description: "Backup R2 storage"
        default: true

  # Triggered by backend after artist submission
  repository_dispatch:
    types: [backup-on-submission]

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false # Don't cancel running backups

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # R2 backup can take a while for large buckets

    steps:
      - name: Get secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        id: bitwarden-secrets
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            546972ad-7db9-4525-8d30-b46e00f8802a > HETZNER_IP
            32944dfd-70f2-4f57-8274-b46e00f77c41 > HETZNER_SSH_KEY

      - name: Determine backup type
        id: backup-type
        env:
          EVENT: ${{ github.event_name }}
          # Boolean inputs: an unchecked box is false and must stay false.
          IN_DB: ${{ inputs.backup_db }}
          IN_R2: ${{ inputs.backup_r2 }}
          IN_FULL: ${{ inputs.full_r2_backup }}
        run: |
          # Default: DB only for submission triggers, full backup for cron/manual
          if [[ "$EVENT" == "repository_dispatch" ]]; then
            echo "backup_db=true" >> "$GITHUB_OUTPUT"
            echo "backup_r2=false" >> "$GITHUB_OUTPUT"
            echo "full_r2=false" >> "$GITHUB_OUTPUT"
            echo "trigger=artist-submission" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == "schedule" ]]; then
            echo "backup_db=true" >> "$GITHUB_OUTPUT"
            echo "backup_r2=true" >> "$GITHUB_OUTPUT"
            echo "full_r2=true" >> "$GITHUB_OUTPUT"
            echo "trigger=weekly-cron" >> "$GITHUB_OUTPUT"
          else
            # Only an explicit false skips a part; a missing value keeps the default.
            echo "backup_db=$([[ "$IN_DB" == false ]] && echo false || echo true)" >> "$GITHUB_OUTPUT"
            echo "backup_r2=$([[ "$IN_R2" == false ]] && echo false || echo true)" >> "$GITHUB_OUTPUT"
            echo "full_r2=$([[ "$IN_FULL" == true ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "trigger=manual" >> "$GITHUB_OUTPUT"
          fi

      - name: Log backup configuration
        env:
          EVENT: ${{ github.event_name }}
          TRIGGER: ${{ steps.backup-type.outputs.trigger }}
          BACKUP_DB: ${{ steps.backup-type.outputs.backup_db }}
          BACKUP_R2: ${{ steps.backup-type.outputs.backup_r2 }}
          FULL_R2: ${{ steps.backup-type.outputs.full_r2 }}
          ARTIST_ID: ${{ github.event.client_payload.artist_id }}
        run: |
          echo "Backup trigger: $TRIGGER"
          echo "Backup DB: $BACKUP_DB"
          echo "Backup R2: $BACKUP_R2"
          echo "Full R2 snapshot: $FULL_R2"
          if [[ "$EVENT" == "repository_dispatch" ]]; then
            echo "Artist ID: $ARTIST_ID"
          fi

      - name: Setup SSH key
        env:
          HETZNER_IP: ${{ steps.bitwarden-secrets.outputs.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ steps.bitwarden-secrets.outputs.HETZNER_SSH_KEY }}
          # Pinned host key of the production server; a different key stops the backup.
          PROD_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL76nCwfiKTFFhXYlN68sxFT4jd0m9IAQpmbLFyL/nru
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner.pem
          chmod 600 ~/.ssh/hetzner.pem
          printf '%s %s\n' "$HETZNER_IP" "$PROD_HOST_KEY" > ~/.ssh/prod_known_hosts

      # The box gets the backup scripts from deploy_hetzner.sh, but rclone has no
      # config there until this runs. setup_rclone.sh reads the R2 keys from the
      # deployed .env and writes /root/.config/rclone/rclone.conf. Idempotent.
      - name: Ensure rclone is configured on the box
        env:
          HETZNER_IP: ${{ steps.bitwarden-secrets.outputs.HETZNER_IP }}
        run: |
          ssh -i ~/.ssh/hetzner.pem -o UserKnownHostsFile="$HOME/.ssh/prod_known_hosts" \
            -o StrictHostKeyChecking=yes root@"$HETZNER_IP" \
            "cd /opt/unheard-backend && ./scripts/backup/setup_rclone.sh"

      - name: Run database backup
        if: steps.backup-type.outputs.backup_db == 'true'
        env:
          HETZNER_IP: ${{ steps.bitwarden-secrets.outputs.HETZNER_IP }}
        run: |
          echo "Running database backup on the Hetzner box..."
          ssh -i ~/.ssh/hetzner.pem -o UserKnownHostsFile="$HOME/.ssh/prod_known_hosts" \
            -o StrictHostKeyChecking=yes root@"$HETZNER_IP" \
            "cd /opt/unheard-backend && ./scripts/backup/backup-db.sh"

      - name: Run R2 backup
        if: steps.backup-type.outputs.backup_r2 == 'true'
        env:
          HETZNER_IP: ${{ steps.bitwarden-secrets.outputs.HETZNER_IP }}
          FULL_R2: ${{ steps.backup-type.outputs.full_r2 }}
        run: |
          echo "Running R2 backup on the Hetzner box..."
          FULL_FLAG=""
          if [[ "$FULL_R2" == "true" ]]; then
            FULL_FLAG="--full"
          fi
          ssh -i ~/.ssh/hetzner.pem -o UserKnownHostsFile="$HOME/.ssh/prod_known_hosts" \
            -o StrictHostKeyChecking=yes root@"$HETZNER_IP" \
            "cd /opt/unheard-backend && ./scripts/backup/backup-r2.sh $FULL_FLAG"

      - name: Backup summary
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          TRIGGER: ${{ steps.backup-type.outputs.trigger }}
          STATUS: ${{ job.status }}
          ARTIST_ID: ${{ github.event.client_payload.artist_id }}
        run: |
          echo "=== Backup Job Complete ==="
          echo "Trigger: $TRIGGER"
          echo "Status: $STATUS"
          if [[ "$EVENT" == "repository_dispatch" ]]; then
            echo "Artist ID: $ARTIST_ID"
          fi
