name: FRONTEND - Build and Deploy

on:
  push:
    branches: [main, dev/312-interim, dev/streaming-architecture]
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
  pull_request:
    branches: [main, dev/312-interim, dev/streaming-architecture]
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      # Python setup for SoundCloud API
      - name: Setup Python
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: astral-sh/setup-uv@v5

      - name: Get secrets from Bitwarden
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: bitwarden/sm-action@v2
        id: bitwarden-secrets
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            0ede7c60-027a-45af-99ae-b3ec013f22a7 > SOUNDCLOUD_CLIENT_ID
            fb23eb6e-139b-45be-a95a-b3ec013f2eac > SOUNDCLOUD_CLIENT_SECRET

      - name: Generate tracks JSON from SoundCloud
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: generate-tracks
        continue-on-error: true
        run: |
          uv run scripts/generate_relisten.py \
            --client-id "${{ steps.bitwarden-secrets.outputs.SOUNDCLOUD_CLIENT_ID }}" \
            --client-secret "${{ steps.bitwarden-secrets.outputs.SOUNDCLOUD_CLIENT_SECRET }}"

      # Node.js setup for frontend build
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate re-listen.html from tracks
        if: steps.generate-tracks.outcome == 'success'
        run: |
          node scripts/generate-html.js
          echo "✅ Generated re-listen.html with SoundCloud tracks"

      - name: Use fallback re-listen.html
        if: steps.generate-tracks.outcome == 'failure' || steps.generate-tracks.outcome == 'skipped'
        run: |
          echo "SoundCloud refresh failed or was skipped; using checked-in tracks."

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test -- --run

      - name: Build website
        run: npm run build
        env:
          # Public stream flip (#176/#194): point the public player at the
          # Hetzner Icecast `/live.mp3` mount (TLS-fronted) + the backend on-air
          # endpoint; the `/test.mp3` var drives the admin broadcaster preview
          # only (#175). Sourced from repo Variables so the cutover is a Settings
          # change + re-run, not a code edit. UNSET = empty → config.ts falls back
          # to the legacy NMS HLS/FLV path (no-op), so merging this is safe.
          # To go live: set the Variables, then re-run this workflow.
          #   VITE_STREAM_ICECAST_LIVE_URL = https://admin.live.moafunk.de/live.mp3
          #   VITE_STREAM_STATUS_URL       = https://admin.live.moafunk.de/api/stream/status
          #   VITE_STREAM_ICECAST_TEST_URL = https://admin.live.moafunk.de/test.mp3  (admin preview only)
          # Rollback: clear the Variables and re-run (NMS stays warm).
          VITE_STREAM_ICECAST_LIVE_URL: ${{ vars.VITE_STREAM_ICECAST_LIVE_URL }}
          VITE_STREAM_STATUS_URL: ${{ vars.VITE_STREAM_STATUS_URL }}
          VITE_STREAM_ICECAST_TEST_URL: ${{ vars.VITE_STREAM_ICECAST_TEST_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: frontend/dist

  deploy:
    # Only deploy on push to main, not on PRs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
