name: TEST - Chaos show on staging

# One test show on https://staging.live.moafunk.de proves the stream, the
# recording and the self-recovery after a dropout (e2e/). A second job,
# instagram-e2e, posts a host's announcements to the Instagram test account.
# It runs every night,
# by hand (a soak of `duration` extra minutes on air), and on each release PR
# into main (e2e-release.yml calls it with release_sha). Not on PRs into
# staging and not after a staging deploy: merges into staging never wait for it.
# Schedule and workflow_dispatch work only once this file is on main.
on:
  workflow_call:
    inputs:
      release_sha:
        description: The release commit; staging must run exactly its image
        type: string
        required: true
      duration:
        description: Extra minutes on air
        type: string
        default: '0'
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Extra minutes on air (soak: 90 before a release)'
        default: '0'

permissions:
  contents: read

jobs:
  chaos-show:
    # One leg per e2e job, one after the other: the chaos test show, then the
    # Instagram announcements (own check on the dashboard, own job name).
    name: ${{ matrix.job }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - job: chaos-show
            project: chaos
          - job: instagram-e2e
            project: instagram
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Two runs never share staging, and a deploy (backend.yml, same group)
    # waits until the run ends. A waiting run starts after the current one.
    concurrency:
      group: staging-box
      cancel-in-progress: false
    env:
      E2E_RUN: ${{ github.run_id }}
      DURATION: ${{ inputs.duration || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The nightly run tests staging with the staging branch's test, a
          # release run with the release commit's test.
          ref: ${{ github.event_name == 'schedule' && 'staging' || inputs.release_sha || '' }}

      - name: Get the staging CI key and the e2e host login from Bitwarden
        id: secrets
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ba04c03e-d633-40a6-a49f-b50301724312 > STAGING_DEPLOY_SSH_KEY
            4a6cfb10-f992-43de-94f6-b50600a71958 > STAGING_E2E_HOST_PASSWORD

      - name: Write the CI key and the pinned host key
        env:
          DEPLOY_KEY: ${{ steps.secrets.outputs.STAGING_DEPLOY_SSH_KEY }}
          # Same host key as the deploy in backend.yml.
          HOST_KEY: staging.live.moafunk.de ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHw+kqXgS8FmHdVOw2gaNMRzTQ+0SjGKYvsuqu8HyFQp
        run: |
          set -euo pipefail
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" >"$RUNNER_TEMP/staging-key")
          printf '%s\n' "$HOST_KEY" >"$RUNNER_TEMP/staging-known-hosts"
          {
            echo "STAGING_SSH_KEY=$RUNNER_TEMP/staging-key"
            echo "STAGING_KNOWN_HOSTS=$RUNNER_TEMP/staging-known-hosts"
          } >>"$GITHUB_ENV"

      - name: Check staging runs the release commit
        # Only for a release PR. Then nothing in CI can change the image
        # during the run: a deploy waits (staging-box) and the test holds
        # staging (e2e-hold), unless the release hold is there already.
        if: inputs.release_sha != ''
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release_sha must be a full commit hash"; exit 1; }
          status="$(ssh -i "$STAGING_SSH_KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS" -o StrictHostKeyChecking=yes \
            root@staging.live.moafunk.de status)"
          echo "Staging: $(tr '\n' ' ' <<<"$status")"
          tag="$(sed -n 's/^tag: //p' <<<"$status")"
          if [[ ! "$tag" =~ ^sha-[0-9a-f]{7,40}$ || "$RELEASE_SHA" != "${tag#sha-}"* ]]; then
            echo "::error::staging runs ${tag:-no image}, not the release sha-${RELEASE_SHA:0:7}. Put that image on staging and hold it (docs/deployment.md), then re-run this job."
            exit 1
          fi
          echo "Staging runs the release: $tag"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install ffmpeg
        uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg

      - name: Install the test and Chromium
        working-directory: e2e
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run typecheck
          npm run unit

      - name: Run the e2e tests of this job
        working-directory: e2e
        env:
          STAGING_E2E_HOST_PASSWORD: ${{ steps.secrets.outputs.STAGING_E2E_HOST_PASSWORD }}
          PROJECT: ${{ matrix.project }}
        run: npx playwright test --project "$PROJECT"

      - name: Restore the announcement settings (also after a failure)
        # The test restores them itself; this covers a timeout or a cancel.
        if: always() && matrix.project == 'instagram' && env.STAGING_SSH_KEY != ''
        run: |
          ssh -i "$STAGING_SSH_KEY" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS" -o StrictHostKeyChecking=yes \
            root@staging.live.moafunk.de "e2e-instagram off"

      - name: Remove this run's hold (also after a failure)
        if: always() && env.STAGING_SSH_KEY != ''
        run: |
          ssh -i "$STAGING_SSH_KEY" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o UserKnownHostsFile="$STAGING_KNOWN_HOSTS" -o StrictHostKeyChecking=yes \
            root@staging.live.moafunk.de "e2e-unhold $E2E_RUN"

      - name: Keep the trace and screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-staging-${{ matrix.project }}-${{ github.run_id }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  dashboard:
    # The test dashboard after every run: nightly, by hand or on a release PR
    # (a soak when duration > 0).
    needs: chaos-show
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/test-dashboard.yml
    with:
      soak-minutes: ${{ inputs.duration || '0' }}
    secrets: inherit
