name: BACKEND - Build, Push and Deploy Image (GHCR)

on:
  push:
    # The staging branch builds sha-* images for the staging server. Only main moves `latest`.
    branches: [main, staging]
    paths:
      - backend/**
      - frontend/src/admin/**
      - frontend/package*.json
      - .github/workflows/backend.yml
  workflow_dispatch:
    inputs:
      build:
        type: boolean
        description: "Build and push image to GHCR (does not deploy the API)"
        default: true
      deploy_monitoring:
        type: boolean
        description: "Deploy the monitoring stack to Hetzner (separate production action)"
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Must match what docker-compose.prod.yml / deploy_hetzner.sh pull in production.
  # Use the repo owner namespace so the default GITHUB_TOKEN can push to GHCR.
  IMAGE_NAME: ${{ github.repository_owner }}/live.moafunk.de-backend

jobs:
  build-and-push:
    if: github.event_name != 'workflow_dispatch' || inputs.build == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # A new build must not cancel a monitoring job or an older deployment run.
    concurrency:
      group: backend-image-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      image: ${{ steps.image-reference.outputs.image }}
      source-sha: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No QEMU: we build linux/amd64 on an amd64 runner. BuildKit and the base
      # images come from mirrors, because Docker Hub pulls fail on the runners.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN can push to ghcr.io/<repo_owner>/* when packages: write is granted.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=sha,prefix=sha-,format=long

      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          # Bake the stream URLs into the admin SPA (Vite inlines them at build
          # time). Same repo Variables the Pages build uses; empty → no-op.
          build-args: |
            VITE_STREAM_ICECAST_LIVE_URL=${{ vars.VITE_STREAM_ICECAST_LIVE_URL }}
            VITE_STREAM_ICECAST_TEST_URL=${{ vars.VITE_STREAM_ICECAST_TEST_URL }}
            VITE_STREAM_STATUS_URL=${{ vars.VITE_STREAM_STATUS_URL }}
            GIT_SHA=${{ github.sha }}
          # Always push — workflow only runs on main or manual dispatch
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record image for manual deployment
        id: image-reference
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Missing or invalid image digest\n' >&2
            exit 1
          fi
          printf 'image=%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_OUTPUT"
          {
            printf '### Backend image built\n\n'
            printf 'Source commit: `%s`\n\n' "$SOURCE_SHA"
            printf 'Image: `%s@%s`\n\n' "$IMAGE" "$DIGEST"
            printf 'The API was not deployed. Use the approved maintenance procedure.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    # Put the image just built on the staging server
    # (https://staging.live.moafunk.de). Only for pushes to the staging
    # branch. No production access: the box lets this key run only
    # `staging.sh ci-deploy` (backend/staging/README.md). During a release
    # check, `staging.sh hold` makes this a no-op with a notice.
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # "true" only when this image is now on staging; empty on hold.
      deployed: ${{ steps.deploy.outputs.deployed }}
    # Shared with the chaos test show (e2e-staging.yml): a deploy waits for a
    # running test instead of landing mid-show or being skipped by its hold.
    concurrency:
      group: staging-box
      cancel-in-progress: false
    environment:
      name: staging
      url: https://staging.live.moafunk.de

    steps:
      - name: Get the staging deploy key from Bitwarden
        id: key
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ba04c03e-d633-40a6-a49f-b50301724312 > STAGING_DEPLOY_SSH_KEY

      - name: Deploy the exact image to staging
        id: deploy
        env:
          DEPLOY_KEY: ${{ steps.key.outputs.STAGING_DEPLOY_SSH_KEY }}
          SOURCE_SHA: ${{ needs.build-and-push.outputs.source-sha }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
          # Pinned host key of the staging server; a different key stops the deploy.
          HOST_KEY: staging.live.moafunk.de ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHw+kqXgS8FmHdVOw2gaNMRzTQ+0SjGKYvsuqu8HyFQp
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "missing image digest" >&2; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "missing source commit" >&2; exit 1; }
          key="$RUNNER_TEMP/staging-deploy-key"
          known="$RUNNER_TEMP/staging-known-hosts"
          trap 'rm -f "$key" "$known"' EXIT
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" >"$key")
          printf '%s\n' "$HOST_KEY" >"$known"
          tag="sha-${SOURCE_SHA:0:7}"
          code=0
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o UserKnownHostsFile="$known" -o StrictHostKeyChecking=yes \
            root@staging.live.moafunk.de "deploy $tag $DIGEST" || code=$?
          if [[ "$code" == 3 ]]; then
            echo "::notice title=Staging is on hold::$tag was built but not deployed, so its chaos test show does not run. Run staging.sh unhold on the box to resume."
            exit 0
          fi
          [[ "$code" == 0 ]] || exit "$code"
          echo "deployed=true" >>"$GITHUB_OUTPUT"

  e2e-staging:
    # The chaos test show on what was just deployed (e2e-staging.yml). A
    # failed run turns this workflow red; staging keeps the deployed image.
    # Skipped on hold: staging still runs an older image, and a green run
    # here would let release-gate pass a commit that staging never ran.
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging' && needs['deploy-staging'].outputs.deployed == 'true'
    uses: ./.github/workflows/e2e-staging.yml
    secrets: inherit

  deploy-monitoring:
    # Deploy monitoring to Hetzner only when explicitly requested.
    # Additive + reversible: never touches the backend, the stream stack, or DNS.
    # Secrets come from Bitwarden. Grafana's admin
    # password defaults to 'admin' (UI is 127.0.0.1-only, SSH-tunnelled) — set
    # GRAFANA_ADMIN_PASSWORD in /etc/moafunk/monitoring/monitoring.env to harden.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_monitoring == true
    runs-on: ubuntu-latest
    concurrency:
      group: backend-monitoring-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        id: bitwarden-secrets
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            546972ad-7db9-4525-8d30-b46e00f8802a > HETZNER_IP
            32944dfd-70f2-4f57-8274-b46e00f77c41 > HETZNER_SSH_KEY
            2470e0a8-7e96-4113-9931-b3ed0180cf59 > TELEGRAM_BOT_TOKEN
            3d3c982b-6933-4c23-bb11-b3ee000687d6 > TELEGRAM_ADMIN_CHAT_ID

      - name: Setup SSH key
        env:
          HETZNER_IP: ${{ steps.bitwarden-secrets.outputs.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ steps.bitwarden-secrets.outputs.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner.pem
          chmod 600 ~/.ssh/hetzner.pem
          ssh-keyscan -H "$HETZNER_IP" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy observability stack
        env:
          IP: ${{ steps.bitwarden-secrets.outputs.HETZNER_IP }}
          TELEGRAM_BOT_TOKEN: ${{ steps.bitwarden-secrets.outputs.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ steps.bitwarden-secrets.outputs.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          IP="$IP" \
          SSH_KEY=~/.ssh/hetzner.pem \
          TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
          TELEGRAM_ADMIN_CHAT_ID="$TELEGRAM_ADMIN_CHAT_ID" \
          ./backend/scripts/deploy_monitoring.sh
