name: BACKEND - Build, Push and Deploy Image (GHCR)

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/src/admin/**
      - frontend/package*.json
      - .github/workflows/backend.yml
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        description: "Deploy to Lightsail (restarts containers)"
        default: false
      deploy_hetzner:
        type: boolean
        description: "Deploy to Hetzner (greenfield #194; manual only, restarts containers)"
        default: false
      deploy_monitoring:
        type: boolean
        description: "Deploy the #178 observability stack (Prometheus/Alertmanager/Grafana) to the Hetzner box"
        default: false
      build:
        type: boolean
        description: "Build & push image to GHCR"
        default: true
      tag:
        type: string
        description: "Image tag to deploy (only used for manual runs)"
        default: "latest"
      run_tests:
        type: boolean
        description: "Run post-deploy smoke tests"
        default: true
      setup_nginx:
        type: boolean
        description: "Setup nginx reverse proxy + certbot SSL (first deploy only)"
        default: false
      init_db:
        type: boolean
        description: "Initialize fresh SQLite database (first deploy only)"
        default: false
      nginx_domain:
        type: string
        description: "Domain for nginx/certbot"
        default: "admin.live.moafunk.de"
      certbot_email:
        type: string
        description: "Email for Let's Encrypt certbot"
        default: "phaabe@gmail.com"
      stream_output:
        type: choice
        description: "Producer target on Hetzner (icecast = flip to the local Liquidsoap harbor; needs HARBOR_LIVE_PASSWORD in Bitwarden)"
        options:
          - rtmp
          - icecast
        default: rtmp

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Must match what docker-compose.prod.yml / deploy_lightsail.sh pull in production.
  # Use the repo owner namespace so the default GITHUB_TOKEN can push to GHCR.
  IMAGE_NAME: ${{ github.repository_owner }}/live.moafunk.de-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch' || inputs.build == true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: github.event_name != 'workflow_dispatch' || inputs.build == true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: github.event_name != 'workflow_dispatch' || inputs.build == true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        if: github.event_name != 'workflow_dispatch' || inputs.build == true
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN can push to ghcr.io/<repo_owner>/* when packages: write is granted.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        if: github.event_name != 'workflow_dispatch' || inputs.build == true
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        if: github.event_name != 'workflow_dispatch' || inputs.build == true
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          # Bake the stream URLs into the admin SPA (Vite inlines them at build
          # time). Same repo Variables the Pages build uses; empty → no-op.
          build-args: |
            VITE_STREAM_ICECAST_LIVE_URL=${{ vars.VITE_STREAM_ICECAST_LIVE_URL }}
            VITE_STREAM_ICECAST_TEST_URL=${{ vars.VITE_STREAM_ICECAST_TEST_URL }}
            VITE_STREAM_STATUS_URL=${{ vars.VITE_STREAM_STATUS_URL }}
          # Always push — workflow only runs on main or manual dispatch
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Deploy on push to main, or when manually triggered with deploy=true on main.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        id: bitwarden-secrets
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            b97681cf-bf60-49d5-9186-b3e701004d75 > LIGHTSAIL_SSH_KEY
            429acaa6-d722-4882-b072-b3e701003070 > LIGHTSAIL_IP
            780bf50d-98fd-4bd4-b470-b3e701001e63 > GHCR_DEPLOY_TOKEN
            41363d58-f866-4c70-b8e6-b3e70100636b > GHCR_USERNAME
            eeda2f4a-6fb9-470d-a909-b3ec01488545 > SECRET_KEY
            a30cd3c6-2724-44ed-95d3-b3ec0148acdc > SUPERADMIN_PASSWORD_HASH
            9559957d-a86d-4a08-8a4a-b3ec0148d511 > R2_ACCOUNT_ID
            22c94ab2-a97c-4deb-aaee-b3ec0148efe9 > R2_ACCESS_KEY_ID
            df159915-c6ce-470a-9678-b3ec01490ed7 > R2_SECRET_ACCESS_KEY
            3bbfc155-b13a-45bc-aa2a-b3e80089d1ec > INSTAGRAM_ACCESS_TOKEN_DEV
            58e0efe4-94e0-49a4-b4c3-b3eb01558207 > INSTAGRAM_BUSINESS_ACCOUNT_ID_DEV
            17df2212-b8a2-4e8a-9537-b3e80013777e > INSTAGRAM_ACCESS_TOKEN_PROD
            922b4a5b-f803-4502-a182-b3e80090d6b6 > INSTAGRAM_BUSINESS_ACCOUNT_ID_PROD
            57ca8c3f-ada3-4902-88d2-b3e80090c176 > FACEBOOK_APP_ID
            5e2f46de-e289-41d5-85fd-b3e800909ec5 > FACEBOOK_APP_SECRET
            782620cd-7d54-4cef-95b5-b3eb01660ff9 > OPENAI_API_KEY
            2470e0a8-7e96-4113-9931-b3ed0180cf59 > TELEGRAM_BOT_TOKEN
            3d3c982b-6933-4c23-bb11-b3ee000687d6 > TELEGRAM_ADMIN_CHAT_ID
            e7dd127f-7e64-4cef-9ff0-b47f00a6e740 > TELEGRAM_LIVE_CHAT_ID
            0ede7c60-027a-45af-99ae-b3ec013f22a7 > SOUNDCLOUD_CLIENT_ID
            fb23eb6e-139b-45be-a95a-b3ec013f2eac > SOUNDCLOUD_CLIENT_SECRET

      - name: Generate production .env file
        run: |
          cat > /tmp/production.env << 'ENVHEADER'
          # ==============================================
          # Production .env — generated by CI from Bitwarden SM
          # Do NOT edit manually on the server.
          # Update secrets in Bitwarden, then re-deploy.
          # ==============================================

          # App settings
          HOST=0.0.0.0
          PORT=8000
          DATABASE_URL=sqlite:./data/unheard.db?mode=rwc
          MAX_FILE_SIZE_MB=100
          MAX_UPLOAD_SIZE_MB=250
          RUST_LOG=info,tower_http=debug
          ENVHEADER
          sed -i 's/^          //' /tmp/production.env

          # Append secrets (note: GHA masks secret values in logs automatically)
          {
            echo "SECRET_KEY=${{ steps.bitwarden-secrets.outputs.SECRET_KEY }}"
            echo "SUPERADMIN_PASSWORD_HASH=${{ steps.bitwarden-secrets.outputs.SUPERADMIN_PASSWORD_HASH }}"
            echo ""
            echo "# Cloudflare R2"
            echo "R2_ACCOUNT_ID=${{ steps.bitwarden-secrets.outputs.R2_ACCOUNT_ID }}"
            echo "R2_ACCESS_KEY_ID=${{ steps.bitwarden-secrets.outputs.R2_ACCESS_KEY_ID }}"
            echo "R2_SECRET_ACCESS_KEY=${{ steps.bitwarden-secrets.outputs.R2_SECRET_ACCESS_KEY }}"
            echo "R2_BUCKET_NAME=unheard-artists-prod"
            echo "R2_SHOWS_BUCKET_NAME=moafunk-prod"
            echo ""
            echo "# Instagram API (DEV)"
            echo "INSTAGRAM_ACCESS_TOKEN_DEV=${{ steps.bitwarden-secrets.outputs.INSTAGRAM_ACCESS_TOKEN_DEV }}"
            echo "INSTAGRAM_BUSINESS_ACCOUNT_ID_DEV=${{ steps.bitwarden-secrets.outputs.INSTAGRAM_BUSINESS_ACCOUNT_ID_DEV }}"
            echo "# Instagram API (PROD) — uncomment to switch"
            echo "# INSTAGRAM_ACCESS_TOKEN_DEV=${{ steps.bitwarden-secrets.outputs.INSTAGRAM_ACCESS_TOKEN_PROD }}"
            echo "# INSTAGRAM_BUSINESS_ACCOUNT_ID_DEV=${{ steps.bitwarden-secrets.outputs.INSTAGRAM_BUSINESS_ACCOUNT_ID_PROD }}"
            echo ""
            echo "# Instagram API (PROD)"
            echo "INSTAGRAM_ACCESS_TOKEN_PROD=${{ steps.bitwarden-secrets.outputs.INSTAGRAM_ACCESS_TOKEN_PROD }}"
            echo "INSTAGRAM_BUSINESS_ACCOUNT_ID_PROD=${{ steps.bitwarden-secrets.outputs.INSTAGRAM_BUSINESS_ACCOUNT_ID_PROD }}"
            echo ""
            echo "# Facebook (token refresh)"
            echo "FACEBOOK_APP_ID=${{ steps.bitwarden-secrets.outputs.FACEBOOK_APP_ID }}"
            echo "FACEBOOK_APP_SECRET=${{ steps.bitwarden-secrets.outputs.FACEBOOK_APP_SECRET }}"
            echo ""
            echo "# OpenAI"
            echo "OPENAI_API_KEY=${{ steps.bitwarden-secrets.outputs.OPENAI_API_KEY }}"
            echo ""
            echo "# Telegram bot"
            echo "TELEGRAM_BOT_TOKEN=${{ steps.bitwarden-secrets.outputs.TELEGRAM_BOT_TOKEN }}"
            echo "TELEGRAM_ADMIN_CHAT_ID=${{ steps.bitwarden-secrets.outputs.TELEGRAM_ADMIN_CHAT_ID }}"
            echo "TELEGRAM_LIVE_CHAT_ID=${{ steps.bitwarden-secrets.outputs.TELEGRAM_LIVE_CHAT_ID }}"
            echo "TELEGRAM_INSTAGRAM_ACCOUNT=prod"
            echo "TELEGRAM_ARTIST_PREVIEW_HOUR=16"
            echo ""
            echo "# SoundCloud"
            echo "SOUNDCLOUD_CLIENT_ID=${{ steps.bitwarden-secrets.outputs.SOUNDCLOUD_CLIENT_ID }}"
            echo "SOUNDCLOUD_CLIENT_SECRET=${{ steps.bitwarden-secrets.outputs.SOUNDCLOUD_CLIENT_SECRET }}"
            echo "SOUNDCLOUD_REDIRECT_URI=https://admin.live.moafunk.de/api/soundcloud/callback"
            echo ""
            echo "# Backup settings"
            echo "BACKUP_BUCKET=unheard-backups"
            echo "BACKUP_RETENTION=28"
            echo "RCLONE_REMOTE=r2-backup"
          } >> /tmp/production.env

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ steps.bitwarden-secrets.outputs.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          # Add host key to known_hosts to avoid interactive prompt
          ssh-keyscan -H ${{ steps.bitwarden-secrets.outputs.LIGHTSAIL_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to Lightsail
        env:
          GHCR_TOKEN: ${{ steps.bitwarden-secrets.outputs.GHCR_DEPLOY_TOKEN }}
          GHCR_USER: ${{ steps.bitwarden-secrets.outputs.GHCR_USERNAME || github.repository_owner }}
        run: |
          # Write GHCR token to temp file
          echo "$GHCR_TOKEN" > /tmp/ghcr-token.key

          # Run deploy script (skips nginx setup since already configured)
          IP="${{ steps.bitwarden-secrets.outputs.LIGHTSAIL_IP }}" \
          PEM=~/.ssh/lightsail.pem \
          GHCR_USER="$GHCR_USER" \
          GHCR_TOKEN_FILE=/tmp/ghcr-token.key \
          ENV_FILE_PATH=/tmp/production.env \
          UNHEARD_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" \
          UNHEARD_TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'latest' }}" \
          SETUP_NGINX="${{ github.event_name == 'workflow_dispatch' && inputs.setup_nginx && '1' || '0' }}" \
          NGINX_DOMAIN="${{ inputs.nginx_domain || 'admin.live.moafunk.de' }}" \
          CERTBOT_EMAIL="${{ inputs.certbot_email || 'phaabe@gmail.com' }}" \
          INIT_DB="${{ github.event_name == 'workflow_dispatch' && inputs.init_db && '1' || '0' }}" \
          RUN_TESTS="${{ github.event_name == 'workflow_dispatch' && inputs.run_tests == false && '0' || '1' }}" \
          ./backend/scripts/deploy_lightsail.sh

  deploy-hetzner:
    # Greenfield Hetzner deploy (#194). Hetzner is now the production backend, so
    # a push to main auto-deploys here (like the Lightsail `deploy` job did before
    # cutover); manual workflow_dispatch with deploy_hetzner=true still works for
    # ad-hoc runs (e.g. setup_nginx/init_db/a pinned tag). Everything (box IP, SSH
    # key, secrets) comes from Bitwarden SM.
    #
    # PRODUCER MODE: the box runs on Icecast (Liquidsoap harbor), so an automatic
    # push MUST regenerate .env with STREAM_OUTPUT=icecast — a push has no
    # stream_output input, and defaulting to rtmp would point the producer at the
    # retired NMS and take the live stream down. STREAM_OUTPUT_MODE forces icecast
    # on push; manual runs still honor the stream_output choice.
    #
    # NOTE: this restarts unheard-api → drops any in-progress broadcast WS. Merging
    # backend changes to main during a live show will interrupt it.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && inputs.deploy_hetzner == true)
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      STREAM_OUTPUT_MODE: ${{ (github.event_name == 'push' || inputs.stream_output == 'icecast') && 'icecast' || 'rtmp' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        id: bitwarden-secrets
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            546972ad-7db9-4525-8d30-b46e00f8802a > HETZNER_IP
            32944dfd-70f2-4f57-8274-b46e00f77c41 > HETZNER_SSH_KEY
            780bf50d-98fd-4bd4-b470-b3e701001e63 > GHCR_DEPLOY_TOKEN
            41363d58-f866-4c70-b8e6-b3e70100636b > GHCR_USERNAME
            eeda2f4a-6fb9-470d-a909-b3ec01488545 > SECRET_KEY
            a30cd3c6-2724-44ed-95d3-b3ec0148acdc > SUPERADMIN_PASSWORD_HASH
            9559957d-a86d-4a08-8a4a-b3ec0148d511 > R2_ACCOUNT_ID
            22c94ab2-a97c-4deb-aaee-b3ec0148efe9 > R2_ACCESS_KEY_ID
            df159915-c6ce-470a-9678-b3ec01490ed7 > R2_SECRET_ACCESS_KEY
            3bbfc155-b13a-45bc-aa2a-b3e80089d1ec > INSTAGRAM_ACCESS_TOKEN_DEV
            58e0efe4-94e0-49a4-b4c3-b3eb01558207 > INSTAGRAM_BUSINESS_ACCOUNT_ID_DEV
            17df2212-b8a2-4e8a-9537-b3e80013777e > INSTAGRAM_ACCESS_TOKEN_PROD
            922b4a5b-f803-4502-a182-b3e80090d6b6 > INSTAGRAM_BUSINESS_ACCOUNT_ID_PROD
            57ca8c3f-ada3-4902-88d2-b3e80090c176 > FACEBOOK_APP_ID
            5e2f46de-e289-41d5-85fd-b3e800909ec5 > FACEBOOK_APP_SECRET
            782620cd-7d54-4cef-95b5-b3eb01660ff9 > OPENAI_API_KEY
            2470e0a8-7e96-4113-9931-b3ed0180cf59 > TELEGRAM_BOT_TOKEN
            3d3c982b-6933-4c23-bb11-b3ee000687d6 > TELEGRAM_ADMIN_CHAT_ID
            e7dd127f-7e64-4cef-9ff0-b47f00a6e740 > TELEGRAM_LIVE_CHAT_ID
            0ede7c60-027a-45af-99ae-b3ec013f22a7 > SOUNDCLOUD_CLIENT_ID
            fb23eb6e-139b-45be-a95a-b3ec013f2eac > SOUNDCLOUD_CLIENT_SECRET

      # Producer flip (#176/#194): only when deploying with stream_output=icecast.
      # Kept in a separate, conditional step so the default RTMP path never needs
      # this secret. HARBOR_LIVE_PASSWORD lives in the Bitwarden SM project
      # alongside the box's /etc/moafunk/stream.env value; keep the two in sync
      # whenever the harbor password is rotated.
      - name: Get stream secrets from Bitwarden (icecast flip only)
        if: env.STREAM_OUTPUT_MODE == 'icecast'
        uses: bitwarden/sm-action@v2
        id: stream-secrets
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ea873605-a662-4a0f-99a9-b46e011fc8d6 > HARBOR_LIVE_PASSWORD
            110bdca6-3a7b-477e-bce6-b46e011fb511 > HARBOR_TEST_PASSWORD

      # Mirrors the Lightsail `deploy` job's .env generation exactly. Keep the two
      # in sync; the goal of the migration is an identical backend on Hetzner.
      - name: Generate production .env file
        run: |
          cat > /tmp/production.env << 'ENVHEADER'
          # ==============================================
          # Production .env — generated by CI from Bitwarden SM
          # Do NOT edit manually on the server.
          # Update secrets in Bitwarden, then re-deploy.
          # ==============================================

          # App settings
          HOST=0.0.0.0
          PORT=8000
          DATABASE_URL=sqlite:./data/unheard.db?mode=rwc
          MAX_FILE_SIZE_MB=100
          MAX_UPLOAD_SIZE_MB=250
          RUST_LOG=info,tower_http=debug
          ENVHEADER
          sed -i 's/^          //' /tmp/production.env

          {
            echo "SECRET_KEY=${{ steps.bitwarden-secrets.outputs.SECRET_KEY }}"
            echo "SUPERADMIN_PASSWORD_HASH=${{ steps.bitwarden-secrets.outputs.SUPERADMIN_PASSWORD_HASH }}"
            echo ""
            echo "# Cloudflare R2"
            echo "R2_ACCOUNT_ID=${{ steps.bitwarden-secrets.outputs.R2_ACCOUNT_ID }}"
            echo "R2_ACCESS_KEY_ID=${{ steps.bitwarden-secrets.outputs.R2_ACCESS_KEY_ID }}"
            echo "R2_SECRET_ACCESS_KEY=${{ steps.bitwarden-secrets.outputs.R2_SECRET_ACCESS_KEY }}"
            echo "R2_BUCKET_NAME=unheard-artists-prod"
            echo "R2_SHOWS_BUCKET_NAME=moafunk-prod"
            echo ""
            echo "# Instagram API (DEV)"
            echo "INSTAGRAM_ACCESS_TOKEN_DEV=${{ steps.bitwarden-secrets.outputs.INSTAGRAM_ACCESS_TOKEN_DEV }}"
            echo "INSTAGRAM_BUSINESS_ACCOUNT_ID_DEV=${{ steps.bitwarden-secrets.outputs.INSTAGRAM_BUSINESS_ACCOUNT_ID_DEV }}"
            echo ""
            echo "# Instagram API (PROD)"
            echo "INSTAGRAM_ACCESS_TOKEN_PROD=${{ steps.bitwarden-secrets.outputs.INSTAGRAM_ACCESS_TOKEN_PROD }}"
            echo "INSTAGRAM_BUSINESS_ACCOUNT_ID_PROD=${{ steps.bitwarden-secrets.outputs.INSTAGRAM_BUSINESS_ACCOUNT_ID_PROD }}"
            echo ""
            echo "# Facebook (token refresh)"
            echo "FACEBOOK_APP_ID=${{ steps.bitwarden-secrets.outputs.FACEBOOK_APP_ID }}"
            echo "FACEBOOK_APP_SECRET=${{ steps.bitwarden-secrets.outputs.FACEBOOK_APP_SECRET }}"
            echo ""
            echo "# OpenAI"
            echo "OPENAI_API_KEY=${{ steps.bitwarden-secrets.outputs.OPENAI_API_KEY }}"
            echo ""
            echo "# Telegram bot"
            echo "TELEGRAM_BOT_TOKEN=${{ steps.bitwarden-secrets.outputs.TELEGRAM_BOT_TOKEN }}"
            echo "TELEGRAM_ADMIN_CHAT_ID=${{ steps.bitwarden-secrets.outputs.TELEGRAM_ADMIN_CHAT_ID }}"
            echo "TELEGRAM_LIVE_CHAT_ID=${{ steps.bitwarden-secrets.outputs.TELEGRAM_LIVE_CHAT_ID }}"
            echo "TELEGRAM_INSTAGRAM_ACCOUNT=prod"
            echo "TELEGRAM_ARTIST_PREVIEW_HOUR=16"
            echo ""
            echo "# SoundCloud"
            echo "SOUNDCLOUD_CLIENT_ID=${{ steps.bitwarden-secrets.outputs.SOUNDCLOUD_CLIENT_ID }}"
            echo "SOUNDCLOUD_CLIENT_SECRET=${{ steps.bitwarden-secrets.outputs.SOUNDCLOUD_CLIENT_SECRET }}"
            echo "SOUNDCLOUD_REDIRECT_URI=https://admin.live.moafunk.de/api/soundcloud/callback"
            echo ""
            echo "# Backup settings"
            echo "BACKUP_BUCKET=unheard-backups"
            echo "BACKUP_RETENTION=28"
            echo "RCLONE_REMOTE=r2-backup"
            echo ""
            echo "# Stream producer target (#176/#194)"
            if [ "$STREAM_OUTPUT_MODE" = "icecast" ]; then
              # Flip the producer to the co-located Liquidsoap harbor → Icecast.
              # ffmpeg pushes MP3 to the local harbor 'live' mount; metrics poll
              # the local Icecast status JSON. Recording tee stays independent.
              # host.docker.internal → host gateway (see docker-compose.prod.yml
              # extra_hosts). The harbor/Icecast run host-networked on the box;
              # this bridge container's own 127.0.0.1 would NOT reach them.
              echo "STREAM_OUTPUT=icecast"
              echo "ICECAST_URL=icecast://source:${{ steps.stream-secrets.outputs.HARBOR_LIVE_PASSWORD }}@host.docker.internal:8005/live"
              echo "ICECAST_STATUS_URL=http://host.docker.internal:8010/status-json.xsl"
              # Private `/test` mount for the broadcaster's "Test Your Stream"
              # step (?test=true): same harbor, separate mount + password. Lets a
              # host rehearse through the real path without going public.
              echo "ICECAST_TEST_URL=icecast://source:${{ steps.stream-secrets.outputs.HARBOR_TEST_PASSWORD }}@host.docker.internal:8005/test"
            else
              # Default: unchanged from Lightsail — producer pushes RTMP to NMS
              # (backend config supplies the RTMP destination default).
              echo "STREAM_OUTPUT=rtmp"
            fi
          } >> /tmp/production.env

      - name: Setup SSH key
        env:
          HETZNER_IP: ${{ steps.bitwarden-secrets.outputs.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ steps.bitwarden-secrets.outputs.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner.pem
          chmod 600 ~/.ssh/hetzner.pem
          ssh-keyscan -H "$HETZNER_IP" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to Hetzner
        env:
          GHCR_TOKEN: ${{ steps.bitwarden-secrets.outputs.GHCR_DEPLOY_TOKEN }}
          GHCR_USER: ${{ steps.bitwarden-secrets.outputs.GHCR_USERNAME || github.repository_owner }}
          HETZNER_IP: ${{ steps.bitwarden-secrets.outputs.HETZNER_IP }}
        run: |
          echo "$GHCR_TOKEN" > /tmp/ghcr-token.key

          # SSH_USER defaults to root (Hetzner Cloud Ubuntu images) in the script.
          IP="$HETZNER_IP" \
          SSH_KEY=~/.ssh/hetzner.pem \
          GHCR_USER="$GHCR_USER" \
          GHCR_TOKEN_FILE=/tmp/ghcr-token.key \
          ENV_FILE_PATH=/tmp/production.env \
          UNHEARD_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" \
          UNHEARD_TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || 'latest' }}" \
          SETUP_NGINX="${{ inputs.setup_nginx && '1' || '0' }}" \
          NGINX_DOMAIN="${{ inputs.nginx_domain || 'admin.live.moafunk.de' }}" \
          CERTBOT_EMAIL="${{ inputs.certbot_email || 'phaabe@gmail.com' }}" \
          INIT_DB="${{ inputs.init_db && '1' || '0' }}" \
          RUN_TESTS="${{ inputs.run_tests == false && '0' || '1' }}" \
          ./backend/scripts/deploy_hetzner.sh

      # Sync the Liquidsoap producer config (#194). The .liq is NOT baked into
      # the backend image — it's bind-mounted into the host's liquidsoap
      # container at /etc/moafunk/moafunk.liq (see docs/stream-rework/prod/
      # liquidsoap.service). Without this, repo edits to the encoder (e.g. the
      # 256k output bitrate) never reach the box and the stream silently keeps
      # the old settings. Restart Liquidsoap ONLY when the file actually changed,
      # so routine backend pushes don't gap the stream. (The deploy step above
      # already restarts unheard-api and drops any in-progress broadcast WS, so a
      # same-deploy Liquidsoap restart adds no new live-show hazard.)
      - name: Sync Liquidsoap config to Hetzner (icecast only)
        if: env.STREAM_OUTPUT_MODE == 'icecast'
        env:
          HETZNER_IP: ${{ steps.bitwarden-secrets.outputs.HETZNER_IP }}
        run: |
          set -euo pipefail
          KEY=~/.ssh/hetzner.pem
          HOST="root@${HETZNER_IP}"   # Hetzner Cloud Ubuntu images log in as root

          scp -i "$KEY" -o StrictHostKeyChecking=no \
            docs/stream-rework/prod/moafunk.liq "$HOST:/tmp/moafunk.liq.new"

          ssh -i "$KEY" -o StrictHostKeyChecking=no "$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          DEST=/etc/moafunk/moafunk.liq
          NEW=/tmp/moafunk.liq.new
          if [[ -f "$DEST" ]] && cmp -s "$NEW" "$DEST"; then
            echo "Liquidsoap config unchanged — skipping restart."
            rm -f "$NEW"
            exit 0
          fi
          echo "Liquidsoap config changed — installing and restarting."
          install -m 644 "$NEW" "$DEST"
          rm -f "$NEW"
          systemctl restart liquidsoap
          sleep 5
          if systemctl is-active --quiet liquidsoap; then
            echo "liquidsoap active after restart."
          else
            echo "ERROR: liquidsoap failed to start after config sync." >&2
            systemctl status liquidsoap --no-pager -l | tail -30 >&2
            exit 1
          fi
          REMOTE

  deploy-monitoring:
    # Deploy the #178 observability stack to the Hetzner box (manual only).
    # Additive + reversible: never touches the backend, the stream stack, or DNS.
    # Secrets come from Bitwarden, same as the other deploy jobs. Grafana's admin
    # password defaults to 'admin' (UI is 127.0.0.1-only, SSH-tunnelled) — set
    # GRAFANA_ADMIN_PASSWORD in /etc/moafunk/monitoring/monitoring.env to harden.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_monitoring == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        id: bitwarden-secrets
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            546972ad-7db9-4525-8d30-b46e00f8802a > HETZNER_IP
            32944dfd-70f2-4f57-8274-b46e00f77c41 > HETZNER_SSH_KEY
            2470e0a8-7e96-4113-9931-b3ed0180cf59 > TELEGRAM_BOT_TOKEN
            3d3c982b-6933-4c23-bb11-b3ee000687d6 > TELEGRAM_ADMIN_CHAT_ID

      - name: Setup SSH key
        env:
          HETZNER_IP: ${{ steps.bitwarden-secrets.outputs.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ steps.bitwarden-secrets.outputs.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner.pem
          chmod 600 ~/.ssh/hetzner.pem
          ssh-keyscan -H "$HETZNER_IP" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy observability stack
        env:
          IP: ${{ steps.bitwarden-secrets.outputs.HETZNER_IP }}
          TELEGRAM_BOT_TOKEN: ${{ steps.bitwarden-secrets.outputs.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ steps.bitwarden-secrets.outputs.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          IP="$IP" \
          SSH_KEY=~/.ssh/hetzner.pem \
          TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
          TELEGRAM_ADMIN_CHAT_ID="$TELEGRAM_ADMIN_CHAT_ID" \
          ./backend/scripts/deploy_monitoring.sh

  sync-scripts:
    # Sync backup/r2/db scripts to Lightsail without a full deploy.
    # Runs on push to main when only scripts changed, or always during full deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Need HEAD~1 for git diff

      - name: Check if scripts changed
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q '^backend/scripts/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Get secrets from Bitwarden
        if: steps.changes.outputs.changed == 'true'
        uses: bitwarden/sm-action@v2
        id: bitwarden-secrets
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            b97681cf-bf60-49d5-9186-b3e701004d75 > LIGHTSAIL_SSH_KEY
            429acaa6-d722-4882-b072-b3e701003070 > LIGHTSAIL_IP

      - name: Upload scripts to Lightsail
        if: steps.changes.outputs.changed == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ steps.bitwarden-secrets.outputs.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/lightsail.pem
          chmod 600 ~/.ssh/lightsail.pem
          ssh-keyscan -H ${{ steps.bitwarden-secrets.outputs.LIGHTSAIL_IP }} >> ~/.ssh/known_hosts 2>/dev/null

          SSH_HOST="ubuntu@${{ steps.bitwarden-secrets.outputs.LIGHTSAIL_IP }}"
          PEM=~/.ssh/lightsail.pem
          REMOTE_DIR=/opt/unheard-backend

          echo "Uploading scripts to Lightsail..."
          for dir in backup r2 db config; do
            if [[ -d "backend/scripts/$dir" ]]; then
              # Create matching dir in /tmp so scp copies only contents
              ssh -i "$PEM" -o StrictHostKeyChecking=no "$SSH_HOST" "mkdir -p /tmp/scripts-upload/$dir"
              scp -i "$PEM" -o StrictHostKeyChecking=no backend/scripts/$dir/* "$SSH_HOST:/tmp/scripts-upload/$dir/"
            fi
          done

          ssh -i "$PEM" -o StrictHostKeyChecking=no "$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          REMOTE_DIR=/opt/unheard-backend
          sudo mkdir -p "$REMOTE_DIR/scripts"
          for dir in backup r2 db config; do
            if [[ -d "/tmp/scripts-upload/$dir" ]]; then
              sudo rm -rf "$REMOTE_DIR/scripts/$dir"
              sudo mkdir -p "$REMOTE_DIR/scripts/$dir"
              sudo mv /tmp/scripts-upload/$dir/* "$REMOTE_DIR/scripts/$dir/"
            fi
          done
          rm -rf /tmp/scripts-upload
          sudo chmod -R +x "$REMOTE_DIR/scripts/"*/*.sh 2>/dev/null || true
          echo "Scripts synced successfully"
          REMOTE
