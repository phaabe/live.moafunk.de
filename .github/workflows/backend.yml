name: BACKEND - Build and Push Image (GHCR)

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/src/admin/**
      - frontend/package*.json
      - .github/workflows/backend.yml
  workflow_dispatch:
    inputs:
      build:
        type: boolean
        description: "Build and push image to GHCR (does not deploy the API)"
        default: true
      deploy_monitoring:
        type: boolean
        description: "Deploy the monitoring stack to Hetzner (separate production action)"
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Must match what docker-compose.prod.yml / deploy_hetzner.sh pull in production.
  # Use the repo owner namespace so the default GITHUB_TOKEN can push to GHCR.
  IMAGE_NAME: ${{ github.repository_owner }}/live.moafunk.de-backend

jobs:
  build-and-push:
    if: github.event_name != 'workflow_dispatch' || inputs.build == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # A new build must not cancel a monitoring job or an older deployment run.
    concurrency:
      group: backend-image-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      image: ${{ steps.image-reference.outputs.image }}
      source-sha: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN can push to ghcr.io/<repo_owner>/* when packages: write is granted.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=sha,prefix=sha-,format=long

      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          # Bake the stream URLs into the admin SPA (Vite inlines them at build
          # time). Same repo Variables the Pages build uses; empty → no-op.
          build-args: |
            VITE_STREAM_ICECAST_LIVE_URL=${{ vars.VITE_STREAM_ICECAST_LIVE_URL }}
            VITE_STREAM_ICECAST_TEST_URL=${{ vars.VITE_STREAM_ICECAST_TEST_URL }}
            VITE_STREAM_STATUS_URL=${{ vars.VITE_STREAM_STATUS_URL }}
          # Always push — workflow only runs on main or manual dispatch
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record image for manual deployment
        id: image-reference
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Missing or invalid image digest\n' >&2
            exit 1
          fi
          printf 'image=%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_OUTPUT"
          {
            printf '### Backend image built\n\n'
            printf 'Source commit: `%s`\n\n' "$SOURCE_SHA"
            printf 'Image: `%s@%s`\n\n' "$IMAGE" "$DIGEST"
            printf 'The API was not deployed. Use the approved maintenance procedure.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-monitoring:
    # Deploy monitoring to Hetzner only when explicitly requested.
    # Additive + reversible: never touches the backend, the stream stack, or DNS.
    # Secrets come from Bitwarden. Grafana's admin
    # password defaults to 'admin' (UI is 127.0.0.1-only, SSH-tunnelled) — set
    # GRAFANA_ADMIN_PASSWORD in /etc/moafunk/monitoring/monitoring.env to harden.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_monitoring == true
    runs-on: ubuntu-latest
    concurrency:
      group: backend-monitoring-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        id: bitwarden-secrets
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            546972ad-7db9-4525-8d30-b46e00f8802a > HETZNER_IP
            32944dfd-70f2-4f57-8274-b46e00f77c41 > HETZNER_SSH_KEY
            2470e0a8-7e96-4113-9931-b3ed0180cf59 > TELEGRAM_BOT_TOKEN
            3d3c982b-6933-4c23-bb11-b3ee000687d6 > TELEGRAM_ADMIN_CHAT_ID

      - name: Setup SSH key
        env:
          HETZNER_IP: ${{ steps.bitwarden-secrets.outputs.HETZNER_IP }}
          HETZNER_SSH_KEY: ${{ steps.bitwarden-secrets.outputs.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/hetzner.pem
          chmod 600 ~/.ssh/hetzner.pem
          ssh-keyscan -H "$HETZNER_IP" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy observability stack
        env:
          IP: ${{ steps.bitwarden-secrets.outputs.HETZNER_IP }}
          TELEGRAM_BOT_TOKEN: ${{ steps.bitwarden-secrets.outputs.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ steps.bitwarden-secrets.outputs.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          IP="$IP" \
          SSH_KEY=~/.ssh/hetzner.pem \
          TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
          TELEGRAM_ADMIN_CHAT_ID="$TELEGRAM_ADMIN_CHAT_ID" \
          ./backend/scripts/deploy_monitoring.sh
