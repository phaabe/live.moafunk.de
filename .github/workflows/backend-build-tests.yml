name: Backend build-only regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-build-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install test dependencies
        run: npm ci --ignore-scripts
        working-directory: frontend

      - name: Check backend workflow
        run: node --test .github/workflows/tests/backend-build.test.cjs
