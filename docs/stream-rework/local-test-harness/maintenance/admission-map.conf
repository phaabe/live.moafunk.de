# Include in http {}, before servers. Used only during the exclusion window.
# Keep the allowlist narrow: even a new GET handler may start work.
map "$request_method:$uri" $moafunk_maintenance_refuse {
    default 1;
    "GET:/health" 0;
    "GET:/api/auth/me" 0;
    "GET:/api/stream/status" 0;
    "GET:/api/stream/metrics" 0;
    "GET:/api/recording/status" 0;
    "GET:/api/shows" 0;
    "GET:/api/my-show" 0;
    "GET:/api/my-shows" 0;
    ~^GET:/api/shows/[0-9]+(/recordings)?$ 0;
    "GET:/live.mp3" 0;
    "GET:/test.mp3" 0;
    "GET:/status-json.xsl" 0;
    "POST:/api/auth/login" 0;
    "POST:/api/auth/logout" 0;
    "POST:/api/stream/stop" 0;
    "POST:/api/recording/stop" 0;
    "POST:/api/recording/marker" 0;
}
