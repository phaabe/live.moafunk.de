# Local route rehearsal only. The 204 response stands in for an upstream.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log notice;
events { worker_connections 64; }
http {
    access_log /tmp/nginx-access.log;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    include /fixture/admission-map.conf;
    server {
        listen 127.0.0.1:8080;
        include /tmp/admission-server.conf;
        location = /metrics { return 404; }
        # Ensure server admission also wins over more-specific locations.
        location = /ws/stream {
            alias /tmp/pre-reload-body;
            limit_rate 64;
        }
        location ^~ /api/shows/ { return 204; }
        location / { return 204; }
    }
}
