# Installed to /etc/needrestart/conf.d/moafunk.conf by backend/scripts/deploy_hetzner.sh.
#
# needrestart runs after unattended-upgrades and restarts every service that
# uses an updated library. The stream units run `docker run --rm`, so a restart
# recreates the container and cuts the live stream. Never restart them
# automatically; they get restarted by hand or by the deploy job only.
# (docker.service is already excluded by the needrestart defaults.)
$nrconf{override_rc}{qr(^icecast\.service$)} = 0;
$nrconf{override_rc}{qr(^liquidsoap\.service$)} = 0;
