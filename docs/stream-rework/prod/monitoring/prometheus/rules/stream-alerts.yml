# Stream alert rules (#178).
#
# DESIGN NOTE (the #178 landmine): NEVER write `... or on() vector(0)` inside an
# alert expression. `vector(0)` is always present and compares `< 1`, so such a
# rule fires PERMANENTLY. That trick is for Grafana *panels* (to show 0 when no
# data), not for alerts. Here "stream-down" and "zero-listeners" are kept as
# SEPARATE alerts, and absence is handled with `absent()` / `up == 0`, never
# `or vector(0)`.
#
# "stream-down" is driven by the Blackbox probe (probe_success) of the Icecast
# STATUS endpoint — exporter-agnostic and certain. (We do NOT probe the audio
# mount: it's an infinite stream that times out blackbox's body read.) The
# icecast_*-based rules are detail. Metric names were reconciled against the
# live exporter (markuslindenberg/icecast_exporter) on 2026-06-19: it emits
# per-mount `icecast_listeners{listenurl=...}` (one series per connected source)
# and `icecast_up`, but NO `icecast_sources` — so source presence is detected
# via the per-mount series existing, not a source count.
groups:
  - name: stream-availability
    rules:
      # The canonical "Icecast is down" alert: the status endpoint is unreachable.
      # Independent of the exporter — if this fails, listeners can't reach the
      # server at all. (Source-level "is the live mount fed?" = IcecastNoLiveSource.)
      - alert: StreamProbeDown
        expr: probe_success{job="blackbox_stream"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Icecast unreachable (status probe failing)"
          description: "Blackbox GET probe of {{ $labels.instance }} has failed for 5m — Icecast is unreachable; listeners cannot reach the stream."

      # The Blackbox probe target itself stopped being scraped (Prometheus can't
      # even run the probe) — distinct from the probe failing.
      - alert: StreamProbeAbsent
        expr: absent(probe_success{job="blackbox_stream"})
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Stream probe metric absent"
          description: "No probe_success samples for blackbox_stream — Blackbox/Prometheus scrape is broken; stream health is unknown."

  - name: icecast-source
    rules:
      # Icecast stats scrape is down (exporter unreachable or Icecast dead).
      - alert: IcecastExporterDown
        expr: up{job="icecast"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Icecast exporter/scrape down"
          description: "Prometheus cannot scrape icecast_exporter for 5m — Icecast may be down or the exporter cannot reach it."

      # The live source mount stopped feeding Icecast. The exporter emits a
      # per-mount `icecast_listeners{listenurl=…/live.mp3}` series ONLY while a
      # source is connected; mksafe keeps it connected at all times, so the series
      # disappearing means Liquidsoap died → real outage. (There is no
      # `icecast_sources` metric — absence of the per-mount series is the signal.)
      - alert: IcecastNoLiveSource
        expr: absent(icecast_listeners{listenurl=~".*/live.mp3"})
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "No source on the Icecast live mount"
          description: "icecast_listeners for the /live.mp3 mount has been absent for 10m — Liquidsoap is not feeding Icecast (mksafe should keep a source connected at all times)."

  - name: stream-listeners
    rules:
      # SEPARATE, low-severity, slow alert — NOT coupled to stream-down. Because
      # mksafe keeps the mount up during dead air, 0 listeners is normal between
      # shows; this is informational. Gate it on a "show-scheduled" signal once
      # the backend exposes one (TODO #178). Kept long (1h) to avoid noise.
      - alert: StreamZeroListenersProlonged
        expr: sum(icecast_listeners) == 0
        for: 1h
        labels: { severity: info }
        annotations:
          summary: "No stream listeners for 1h"
          description: "sum(icecast_listeners) == 0 for 1h. Informational — expected between shows; investigate only if a show is scheduled."

  - name: recording-durability
    # Backend-internal recording/upload health (moafunk_* from the `backend` job,
    # see prometheus.yml). The recording is the system of record; these failures
    # are INVISIBLE to the Icecast/Blackbox probes — the live mount stays healthy
    # while the archive silently breaks. All increase()-based, so they stay quiet
    # until the backend is scraped (no false fire pre-cutover).
    rules:
      # Chunks being dropped right now → recorder/disk can't keep up; the archive
      # for the show in progress is being corrupted. Actionable mid-show.
      - alert: RecordingTeeDropping
        expr: increase(moafunk_recording_tee_dropped_total[5m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Recording tee dropping chunks"
          description: "moafunk_recording_tee_dropped_total increased in the last 5m — the recorder/disk is too slow and the in-progress archive is incomplete."

      # A finalized recording was flagged incomplete (overflow, concat failure,
      # size mismatch, or short duration). One page per occurrence.
      - alert: RecordingFinalizedIncomplete
        expr: increase(moafunk_recording_incomplete_total[15m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "A recording finalized incomplete"
          description: "moafunk_recording_incomplete_total increased — check moafunk_recording_{segment_concat_failures,size_mismatch}_total and the recording logs. Live stream is unaffected; the archive is at risk."

      # R2 uploads of recordings are failing — the local file is kept, but the
      # archive isn't durable until this clears.
      - alert: RecordingR2UploadFailing
        expr: increase(moafunk_recording_r2_upload_failures_total[1h]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Recording upload to R2 failing"
          description: "moafunk_recording_r2_upload_failures_total increased in the last hour — recordings are not reaching R2; local copies are retained pending retry."

      # The backend (stream ingest + recorder) stopped being scraped. Meaningful
      # only once the backend runs on this box (post-cutover).
      - alert: BackendMetricsDown
        expr: up{job="backend"} == 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Backend /metrics scrape down"
          description: "Prometheus cannot scrape the backend `/metrics` for 10m — recording-durability alerting is blind. (Expected pre-cutover; investigate once the backend is on this box.)"
