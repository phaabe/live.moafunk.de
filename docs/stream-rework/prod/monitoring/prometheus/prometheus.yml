# Prometheus config for the stream observability stack (#178).
# Scrapes: icecast_exporter (Icecast stats), blackbox (synthetic stream probe),
# and itself. All metrics/admin ports are localhost-bound (see compose).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Icecast stats via markuslindenberg/icecast_exporter (icecast_* metrics).
  - job_name: icecast
    static_configs:
      - targets: ["icecast-exporter:9146"]

  # Backend-internal recording/upload durability metrics (#178). The backend
  # publishes only on the host's 127.0.0.1:8000 (unreachable via host-gateway)
  # and /metrics is 404'd on the public nginx vhost, so Prometheus scrapes the
  # container directly over the shared backend network (see compose `networks`).
  # These moafunk_* counters catch a stuck/failed recorder — invisible to the
  # Icecast/Blackbox probes, which only see the live mount. Activates post-
  # cutover, once the backend runs on this box (pre-cutover the target is down).
  - job_name: backend
    static_configs:
      - targets: ["unheard-api:8000"]

  # Synthetic probe that Icecast is reachable and serving — independent of the
  # exporter, so it catches "the server is unreachable" even if scrapes look ok.
  # We probe the STATUS endpoint (/status-json.xsl), NOT the audio mount: a live
  # MP3 mount is an infinite stream, and blackbox's HTTP prober reads the body to
  # EOF — so probing /live.mp3 always hits the module timeout and fails (verified:
  # 200 HTTP/1.1 but probe_duration == timeout). The status endpoint returns a
  # finite 200. "Is the live SOURCE actually feeding?" is covered separately by
  # the IcecastNoLiveSource alert (per-mount icecast_listeners series presence).
  # GET (never HEAD — Icecast 400s on HEAD); see blackbox.yml module icecast_http.
  # Prometheus does NOT expand env vars here — edit the target directly. Post-
  # cutover, point this at the publicly-reachable status/health URL (a finite
  # endpoint — never the raw mount).
  - job_name: blackbox_stream
    metrics_path: /probe
    params:
      module: [icecast_http]
    static_configs:
      - targets:
          - http://host.docker.internal:8010/status-json.xsl
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
