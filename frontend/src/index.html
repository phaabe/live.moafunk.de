<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moafunk Radio</title>

    <script
      async
      defer
      data-domain="live.moafunk.de"
      src="https://plausible.moafunk.de/js/plausible.js"
    ></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="/main.css" media="screen" />

    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="manifest" href="/icons/site.webmanifest" />
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#333333" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <meta name="msapplication-TileColor" content="#F4EBC6" />
    <meta name="msapplication-config" content="/icons/browserconfig.xml" />
    <meta name="theme-color" content="#F4EBC6" />
    <meta
      http-equiv="Content-Security-Policy"
      content="connect-src 'self' https://admin.live.moafunk.de https://stream.moafunk.de https://plausible.moafunk.de/api/event;"
    />
  </head>
  <body>
    <main class="page">
      <!-- top bar: local clock + coordinates -->
      <div class="topline">
        <span class="now"><span id="clock">--:--</span>&nbsp;· moabit</span>
        <span><span id="coords"></span><span class="cursor" id="coordCursor"></span></span>
      </div>

      <!-- globe — .logo keeps the emoji-explosion click handler from main.ts -->
      <div class="globe-wrap logo">
        <div class="sun"></div>
        <div class="disc">
          <svg
            viewBox="0 0 184 124"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            aria-label="moafunk globe"
          >
            <ellipse cx="92" cy="62" rx="84" ry="54" />
            <ellipse cx="92" cy="62" rx="55" ry="54" stroke-width="1.5" />
            <ellipse cx="92" cy="62" rx="27" ry="54" stroke-width="1.5" />
            <line x1="92" y1="8" x2="92" y2="116" stroke-width="1.5" />
            <line x1="8" y1="62" x2="176" y2="62" stroke-width="1.5" />
            <line x1="12.8" y1="44" x2="171.2" y2="44" stroke-width="1.5" />
            <line x1="12.8" y1="80" x2="171.2" y2="80" stroke-width="1.5" />
            <line x1="29.4" y1="26" x2="154.6" y2="26" stroke-width="1.5" />
            <line x1="29.4" y1="98" x2="154.6" y2="98" stroke-width="1.5" />
            <circle class="pin" cx="118" cy="40" r="5" fill="currentColor" stroke="none" />
            <circle cx="118" cy="40" r="10" stroke-width="1.8" />
          </svg>
        </div>
      </div>

      <h1 class="wordmark">moafunk</h1>
      <p class="tagline">community radio&nbsp;moabit worldwide</p>

      <!-- player elements — sources set dynamically by player.ts -->
      <video id="videoElement" class="video-element"></video>
      <audio id="player"></audio>

      <!-- tune-in button — player.ts sets className to "btn" or "btn btn-pause" -->
      <button id="btn-play" class="btn" onclick="play()" aria-label="tune in">
        <span class="knob">
          <svg class="tri" width="64" height="74" viewBox="0 0 26 28" aria-hidden="true">
            <path d="M2 2 L24 14 L2 26 Z" fill="currentColor" />
          </svg>
          <span class="pause" aria-hidden="true"><span></span><span></span></span>
        </span>
      </button>

      <div id="status"></div>
      <p class="announce">
        we announce shows on <a href="https://2a5.de/h7JV">telegram</a> &amp;
        <a href="https://www.instagram.com/moafunk_radio/">insta</a>
      </p>

      <nav class="links">
        <a href="/pages/re-listen.html">recordings</a>
      </nav>
    </main>

    <script type="module" src="/main.ts"></script>

    <script>
      /* live clock */
      (function () {
        var el = document.getElementById('clock');
        function tick() {
          var d = new Date();
          el.textContent =
            String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        }
        tick();
        setInterval(tick, 10000);
      })();

      /* coordinate typewriter */
      (function () {
        var COORDS = '52.53°N  13.34°E';
        var el = document.getElementById('coords');
        var cur = document.getElementById('coordCursor');
        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) {
          el.textContent = COORDS;
          hideCursor();
          return;
        }
        var i = 0;
        setTimeout(function step() {
          el.textContent = COORDS.slice(0, i);
          if (i++ <= COORDS.length) {
            setTimeout(step, 55);
          } else {
            setTimeout(hideCursor, 700);
          }
        }, 600);
        function hideCursor() {
          cur.style.animation = 'none';
          cur.style.visibility = 'hidden';
        }
      })();
    </script>
  </body>
</html>
