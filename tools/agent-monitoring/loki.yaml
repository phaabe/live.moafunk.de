# Single-process Loki for local runner logs. Nothing leaves this Mac.
auth_enabled: false
server:
  http_listen_port: 3100
  log_level: warn
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 720h
  # The first start reads existing logs; Codex logs hold whole transcripts.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  # Some transcript lines are whole JSON blobs; keep the start, not the batch.
  max_line_size: 16KB
  max_line_size_truncate: true
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
analytics:
  reporting_enabled: false
