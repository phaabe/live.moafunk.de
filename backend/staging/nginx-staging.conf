# nginx vhost for staging. staging.sh setup installs it as
# /etc/nginx/sites-available/staging.live.moafunk.de; certbot then adds TLS.
# Mirrors the production vhost in backend/scripts/deploy_hetzner.sh, but points
# at the staging API (127.0.0.1:8001) and the staging Icecast (127.0.0.1:8020).
server {
  listen 80;
  server_name staging.live.moafunk.de;
  client_max_body_size 260m;

  location = /metrics {
    return 404;
  }

  location = /live.mp3 {
    proxy_pass http://127.0.0.1:8020/live.mp3;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location = /test.mp3 {
    proxy_pass http://127.0.0.1:8020/test.mp3;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location = /status-json.xsl {
    proxy_pass http://127.0.0.1:8020/status-json.xsl;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location / {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
  }
}
